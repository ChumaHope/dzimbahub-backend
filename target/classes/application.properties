spring.application.name=dzimbahub-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dzimbahub}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
# Set APP_JWT_SECRET to a random secret of at least 32 characters in deployment settings.
app.jwt.secret=${APP_JWT_SECRET:local-development-only-secret-change-this-32chars}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
